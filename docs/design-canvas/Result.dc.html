<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    *{ box-sizing: border-box; }
    body { margin: 0; background: #0A0C12; color: #E8EAF2;
           font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8B72FF; } a:hover { color: #7A5FF0; }
    .cap { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500;
           letter-spacing: 0.13em; text-transform: uppercase; color: #7C8398; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0A0C12; display: flex; flex-direction: column;">

  <div style="height: 44px; flex: none;"></div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 28px 20px 0; gap: 30px;">

    <!-- the sorted array, lifted to a compact strip -->
    <div style="display: flex; gap: 6px;">
      <div style="width: 50px; height: 46px; border-radius: 10px; background: rgba(52,211,153,0.16); border: 1.5px solid #34D399;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 18px; font-weight: 500; color: #34D399;">1</span>
      </div>
      <div style="width: 50px; height: 46px; border-radius: 10px; background: rgba(52,211,153,0.16); border: 1.5px solid #34D399;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 18px; font-weight: 500; color: #34D399;">2</span>
      </div>
      <div style="width: 50px; height: 46px; border-radius: 10px; background: rgba(52,211,153,0.16); border: 1.5px solid #34D399;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 18px; font-weight: 500; color: #34D399;">4</span>
      </div>
      <div style="width: 50px; height: 46px; border-radius: 10px; background: rgba(52,211,153,0.16); border: 1.5px solid #34D399;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 18px; font-weight: 500; color: #34D399;">6</span>
      </div>
      <div style="width: 50px; height: 46px; border-radius: 10px; background: rgba(52,211,153,0.16); border: 1.5px solid #34D399;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 18px; font-weight: 500; color: #34D399;">9</span>
      </div>
    </div>

    <!-- stars: 180ms apart, one haptic each -->
    <div style="display: flex; gap: 14px; align-items: center;">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="#8B72FF"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.7 1.2 6.6L12 17.7 6.1 20.8l1.2-6.6L2.5 9.5l6.6-.9z"></path></svg>
      <svg width="38" height="38" viewBox="0 0 24 24" fill="#8B72FF"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.7 1.2 6.6L12 17.7 6.1 20.8l1.2-6.6L2.5 9.5l6.6-.9z"></path></svg>
      <svg width="38" height="38" viewBox="0 0 24 24" fill="#8B72FF"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.7 1.2 6.6L12 17.7 6.1 20.8l1.2-6.6L2.5 9.5l6.6-.9z"></path></svg>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="font-size: 32px; line-height: 36px; font-weight: 700; letter-spacing: -0.025em; color: #E8EAF2;">Bubble Sort</div>
      <div style="display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 14px;
                  background: rgba(52,211,153,0.13); border: 1px solid rgba(52,211,153,0.4);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle><path d="M8.5 12.2l2.4 2.4 4.6-4.9"></path>
        </svg>
        <span class="cap" style="color: #34D399;">Mastered</span>
      </div>
    </div>

    <!-- metrics -->
    <div style="display: flex; width: 100%; border-radius: 16px; background: #12141C; border: 1px solid #242938; overflow: hidden;">
      <div style="flex-grow: 1; padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <span class="mono" style="font-size: 24px; font-weight: 700; color: #E8EAF2;">10</span>
        <span class="cap">Compares</span>
      </div>
      <div style="width: 1px; background: #242938;"></div>
      <div style="flex-grow: 1; padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <span class="mono" style="font-size: 24px; font-weight: 700; color: #E8EAF2;">6</span>
        <span class="cap">Swaps</span>
      </div>
      <div style="width: 1px; background: #242938;"></div>
      <div style="flex-grow: 1; padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <span class="mono" style="font-size: 24px; font-weight: 700; color: #34D399;">100%</span>
        <span class="cap">Accuracy</span>
      </div>
    </div>

    <!-- the verdict line: built from run data, never a template -->
    <div style="text-align: center; font-size: 17px; line-height: 25px; color: #A8AEC2; text-wrap: pretty;">
      You made every decision correctly, and you spotted the early stop on pass&nbsp;4.
    </div>
  </div>

  <div style="flex: none; padding: 0 20px 24px; display: flex; flex-direction: column; gap: 16px;">
    <!-- forward path: never gated by an ad -->
    <div style="height: 56px; border-radius: 14px; background: #8B72FF; display: flex; align-items: center;
                justify-content: center; gap: 10px;">
      <span style="font-size: 15px; font-weight: 600; letter-spacing: 0.03em; color: #0A0C12;">Next: Selection Sort</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0A0C12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13M13 6l6 6-6 6"></path>
      </svg>
    </div>
    <div style="display: flex; justify-content: center; align-items: center; gap: 18px;">
      <span style="font-size: 15px; color: #A8AEC2;">See the code</span>
      <span style="color: #333A4D;">&middot;</span>
      <span style="font-size: 15px; color: #A8AEC2;">Try again</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
