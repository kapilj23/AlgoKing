<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    *{ box-sizing: border-box; }
    body { margin: 0; background: #0A0C12; color: #E8EAF2;
           font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8B72FF; } a:hover { color: #7A5FF0; }
    .cap { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500;
           letter-spacing: 0.13em; text-transform: uppercase; color: #7C8398; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0A0C12; display: flex; flex-direction: column;">

  <div style="height: 44px; flex: none;"></div>

  <!-- challenge chrome: the mode change must read within one second -->
  <div style="height: 40px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8AEC2" stroke-width="2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6L6 18"></path>
    </svg>
    <div style="flex-grow: 1;"></div>
    <span class="cap" style="color: #8B72FF; border: 1px solid rgba(139,114,255,0.34); background: rgba(139,114,255,0.14);
                             border-radius: 999px; padding: 3px 10px;">Challenge</span>
    <div style="display: flex; align-items: center; gap: 5px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7C8398" stroke-width="2.5" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
      <span class="mono" style="font-size: 15px; font-weight: 500; color: #7C8398;">0</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 24px 20px 0; gap: 28px;">

    <div style="font-family: Archivo; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em; color: #E8EAF2;">
      What does this look like after one full pass?
    </div>

    <!-- given -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span class="cap">Start</span>
      <div style="display: flex; gap: 8px;">
        <div style="width: 62px; height: 56px; border-radius: 10px; background: #12141C; border: 1px solid #242938;
                    display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 20px; font-weight: 500; color: #7C8398;">6</span>
        </div>
        <div style="width: 62px; height: 56px; border-radius: 10px; background: #12141C; border: 1px solid #242938;
                    display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 20px; font-weight: 500; color: #7C8398;">2</span>
        </div>
        <div style="width: 62px; height: 56px; border-radius: 10px; background: #12141C; border: 1px solid #242938;
                    display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 20px; font-weight: 500; color: #7C8398;">9</span>
        </div>
        <div style="width: 62px; height: 56px; border-radius: 10px; background: #12141C; border: 1px solid #242938;
                    display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 20px; font-weight: 500; color: #7C8398;">1</span>
        </div>
        <div style="width: 62px; height: 56px; border-radius: 10px; background: #12141C; border: 1px solid #242938;
                    display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 20px; font-weight: 500; color: #7C8398;">4</span>
        </div>
      </div>
    </div>

    <!-- the learner's arrangement -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span class="cap">Your answer</span>
        <span class="cap" style="letter-spacing: 0.04em; text-transform: none; font-size: 12px;">tap two tiles to swap</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <div style="width: 62px; height: 62px; border-radius: 10px; background: #191C26; border: 1px solid #242938;
                    display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 22px; font-weight: 500; color: #E8EAF2;">2</span>
        </div>
        <div style="width: 62px; height: 62px; border-radius: 10px; background: #191C26; border: 1px solid #242938;
                    display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 22px; font-weight: 500; color: #E8EAF2;">6</span>
        </div>
        <div style="width: 62px; height: 62px; border-radius: 10px; background: #191C26; border: 1px solid #242938;
                    display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 22px; font-weight: 500; color: #E8EAF2;">1</span>
        </div>
        <!-- selected, awaiting its partner -->
        <div style="width: 62px; height: 62px; border-radius: 10px; background: #191C26; border: 1.5px dashed #38BDF8;
                    display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 22px; font-weight: 500; color: #E8EAF2;">9</span>
        </div>
        <div style="width: 62px; height: 62px; border-radius: 10px; background: #191C26; border: 1px solid #242938;
                    display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 22px; font-weight: 500; color: #E8EAF2;">4</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 16v-5M12 8h.01"></path>
      </svg>
      <span style="font-size: 15px; color: #A8AEC2;">9 selected &mdash; tap the tile to swap it with.</span>
    </div>
  </div>

  <div style="flex: none; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 14px;">
    <div style="height: 56px; border-radius: 14px; background: #8B72FF; display: flex; align-items: center;
                justify-content: center; gap: 10px;">
      <span style="font-size: 15px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #0A0C12;">Check</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0A0C12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13M13 6l6 6-6 6"></path>
      </svg>
    </div>
    <div style="display: flex; justify-content: center; gap: 8px; align-items: baseline;">
      <span style="font-size: 15px; color: #A8AEC2;">Hint</span>
      <span class="cap" style="letter-spacing: 0.04em; text-transform: none; font-size: 13px;">&middot; 1 free</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
