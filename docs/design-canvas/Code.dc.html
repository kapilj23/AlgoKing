<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    *{ box-sizing: border-box; }
    body { margin: 0; background: #0A0C12; color: #E8EAF2;
           font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8B72FF; } a:hover { color: #7A5FF0; }
    .cap { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500;
           letter-spacing: 0.13em; text-transform: uppercase; color: #7C8398; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .ln { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; line-height: 22px;
          display: flex; gap: 12px; padding: 0 16px; }
    .no { color: #4A5163; width: 12px; text-align: right; flex: none; }
    .kw { color: #8B72FF; } .num { color: #38BDF8; } .fn { color: #34D399; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0A0C12; display: flex; flex-direction: column;">

  <div style="height: 44px; flex: none;"></div>

  <div style="height: 44px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8AEC2" stroke-width="2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6L6 18"></path>
    </svg>
    <span style="flex-grow: 1; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: #E8EAF2;">Bubble Sort</span>
    <div style="display: flex; border-radius: 999px; background: #191C26; border: 1px solid #242938; padding: 3px;">
      <span class="cap" style="color: #0A0C12; background: #8B72FF; border-radius: 999px; padding: 4px 12px;">Java</span>
      <span class="cap" style="padding: 4px 12px;">Py</span>
    </div>
  </div>

  <!-- compact data strip, 30% -->
  <div style="flex: none; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; gap: 6px; align-items: center;">
      <div style="width: 46px; height: 42px; border-radius: 8px; background: #191C26; border: 1px solid #242938;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 17px; font-weight: 500; color: #E8EAF2;">1</span>
      </div>
      <div style="width: 46px; height: 42px; border-radius: 8px; background: rgba(245,165,36,0.24); border: 1.5px solid #F5A524;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 17px; font-weight: 500; color: #E8EAF2;">6</span>
      </div>
      <div style="width: 46px; height: 42px; border-radius: 8px; background: rgba(245,165,36,0.24); border: 1.5px solid #F5A524;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 17px; font-weight: 500; color: #E8EAF2;">2</span>
      </div>
      <div style="width: 46px; height: 42px; border-radius: 8px; background: #191C26; border: 1px solid #242938;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 17px; font-weight: 500; color: #E8EAF2;">9</span>
      </div>
      <div style="width: 46px; height: 42px; border-radius: 8px; background: #191C26; border: 1px solid #242938;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 17px; font-weight: 500; color: #E8EAF2;">4</span>
      </div>
      <div style="flex-grow: 1;"></div>
      <span class="mono" style="font-size: 13px; color: #7C8398;">step 5 / 14</span>
    </div>
  </div>

  <!-- code, 55% -->
  <div style="flex-grow: 1; margin: 0 20px; border-radius: 16px; background: #12141C; border: 1px solid #242938;
              padding: 16px 0; display: flex; flex-direction: column; gap: 0; overflow: hidden;">
    <div class="ln"><span class="no">1</span><span><span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; n - <span class="num">1</span>; i++) {</span></div>
    <div class="ln"><span class="no">2</span><span>&nbsp;&nbsp;<span class="kw">for</span> (<span class="kw">int</span> j = <span class="num">0</span>; j &lt; n-<span class="num">1</span>-i; j++) {</span></div>

    <!-- the decision line -->
    <div class="ln" style="background: rgba(245,165,36,0.12); border-left: 3px solid #F5A524; padding-left: 13px;
                           align-items: center;">
      <span class="no">3</span>
      <span style="flex-grow: 1;">&nbsp;&nbsp;&nbsp;&nbsp;<span class="kw">if</span> (a[j] &gt; a[j+<span class="num">1</span>]) {</span>
      <svg width="11" height="11" viewBox="0 0 12 12" fill="#F5A524" style="flex: none; margin-right: 4px;"><path d="M6 0l6 6-6 6-6-6z"></path></svg>
    </div>

    <div class="ln"><span class="no">4</span><span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="fn">swap</span>(a, j, j+<span class="num">1</span>);</span></div>
    <div class="ln"><span class="no">5</span><span>&nbsp;&nbsp;&nbsp;&nbsp;}</span></div>
    <div class="ln"><span class="no">6</span><span>&nbsp;&nbsp;}</span></div>
    <div class="ln"><span class="no">7</span><span>}</span></div>

    <div style="flex-grow: 1;"></div>

    <!-- the one-time callout: the entire reason this screen exists -->
    <div style="margin: 0 16px; border-radius: 12px; background: rgba(245,165,36,0.10);
                border: 1px solid rgba(245,165,36,0.34); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start;">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="#F5A524" style="flex: none; margin-top: 5px;"><path d="M6 0l6 6-6 6-6-6z"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 15px; font-weight: 600; color: #E8EAF2;">This is the decision you were making.</span>
        <span style="font-size: 15px; color: #A8AEC2;">Swap, or keep.</span>
      </div>
    </div>
  </div>

  <div style="height: 76px; flex: none; padding: 0 20px; display: flex; align-items: center; gap: 18px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C8398" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 5l-7 7 7 7"></path>
    </svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A8AEC2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5l7 7-7 7"></path>
    </svg>
    <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #242938; position: relative;">
      <div style="width: 36%; height: 100%; background: #8B72FF; border-radius: 2px;"></div>
    </div>
    <span style="font-size: 15px; color: #A8AEC2;">Copy</span>
  </div>

</div>
</x-dc>
</body>
</html>
