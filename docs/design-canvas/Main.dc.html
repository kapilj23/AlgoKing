<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    *{ box-sizing: border-box; }
    body { margin: 0; background: #0A0C12; color: #E8EAF2;
           font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8B72FF; } a:hover { color: #7A5FF0; }
    .cap { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500;
           letter-spacing: 0.13em; text-transform: uppercase; color: #7C8398; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0A0C12; display: flex; flex-direction: column;">

  <!-- the device's real status bar renders here; nothing is drawn in it -->
  <div style="height: 44px; flex: none;"></div>

  <!-- transport rail -->
  <div style="height: 40px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8AEC2" stroke-width="2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6L6 18"></path>
    </svg>
    <div style="flex-grow: 1; height: 3px; border-radius: 2px; background: #242938; overflow: hidden;">
      <div style="width: 29%; height: 100%; background: #8B72FF;"></div>
    </div>
    <span class="mono" style="font-size: 13px; color: #7C8398;">4 / 14</span>
    <span class="mono" style="font-size: 13px; color: #A8AEC2; border: 1px solid #333A4D; border-radius: 999px; padding: 2px 9px;">1&times;</span>
  </div>

  <!-- stage: the data is the hero -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 20px;">

    <span class="cap">Pass 1 of 4</span>

    <!-- comparison glyph, sitting over the pair -->
    <div style="width: 100%; display: flex; justify-content: center;">
      <div style="margin-left: 30px; display: flex; align-items: center; gap: 8px;
                  background: rgba(245,165,36,0.14); border: 1px solid rgba(245,165,36,0.45);
                  border-radius: 999px; padding: 5px 14px;">
        <span class="mono" style="font-size: 15px; font-weight: 500; color: #F5A524;">8 &gt; 2</span>
      </div>
    </div>

    <!-- array -->
    <div style="display: flex; gap: 8px; width: 100%; justify-content: center;">
      <div style="width: 62px; height: 62px; border-radius: 10px; background: #191C26; border: 1px solid #242938;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 22px; font-weight: 500; color: #E8EAF2;">3</span>
      </div>
      <div style="width: 62px; height: 62px; border-radius: 10px; background: #191C26; border: 1px solid #242938;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 22px; font-weight: 500; color: #E8EAF2;">7</span>
      </div>
      <div style="width: 62px; height: 62px; border-radius: 10px; background: rgba(245,165,36,0.24); border: 2px solid #F5A524;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 22px; font-weight: 500; color: #E8EAF2;">8</span>
      </div>
      <div style="width: 62px; height: 62px; border-radius: 10px; background: rgba(245,165,36,0.24); border: 2px solid #F5A524;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 22px; font-weight: 500; color: #E8EAF2;">2</span>
      </div>
      <div style="width: 62px; height: 62px; border-radius: 10px; background: #191C26; border: 1px solid #242938;
                  display: flex; align-items: center; justify-content: center;">
        <span class="mono" style="font-size: 22px; font-weight: 500; color: #E8EAF2;">5</span>
      </div>
    </div>

    <!-- pointer rail: pointers live BELOW the array so a cell can be both compared and pointed at -->
    <div style="display: flex; gap: 8px; width: 100%; justify-content: center; margin-top: -8px;">
      <div style="width: 62px;"></div>
      <div style="width: 62px;"></div>
      <div style="width: 62px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <svg width="12" height="7" viewBox="0 0 12 7" fill="#38BDF8"><path d="M6 0l6 7H0z"></path></svg>
        <span class="cap" style="color: #38BDF8;">j</span>
      </div>
      <div style="width: 62px;"></div>
      <div style="width: 62px;"></div>
    </div>
  </div>

  <!-- narration strip: fixed height so the array never shifts -->
  <div style="height: 72px; flex: none; padding: 0 20px; display: flex; flex-direction: column; justify-content: center; gap: 3px;">
    <div style="font-size: 17px; line-height: 24px; font-weight: 500; color: #E8EAF2;">8 is bigger than 2.</div>
    <div style="font-size: 17px; line-height: 24px; font-weight: 400; color: #A8AEC2;">They swap.</div>
  </div>

  <!-- metric rail -->
  <div style="height: 52px; flex: none; padding: 0 20px; display: flex; align-items: center; gap: 28px;
              border-top: 1px solid #242938;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span class="cap">Comparisons</span>
      <span class="mono" style="font-size: 15px; font-weight: 500; color: #E8EAF2;">3</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span class="cap">Swaps</span>
      <span class="mono" style="font-size: 15px; font-weight: 500; color: #E8EAF2;">1</span>
    </div>
  </div>

  <!-- decision zone: reserved and empty during Watch, so nothing moves at the handoff to Try -->
  <div style="height: 104px; flex: none;"></div>

  <!-- transport -->
  <div style="height: 64px; flex: none; display: flex; align-items: center; justify-content: center; gap: 28px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7C8398" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 19l-7-7 7-7M20 19l-7-7 7-7"></path>
    </svg>
    <div style="width: 54px; height: 54px; border-radius: 999px; background: #191C26; border: 1px solid #333A4D;
                display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8EAF2" stroke-width="2" stroke-linecap="round">
        <path d="M9 5v14M15 5v14"></path>
      </svg>
    </div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A8AEC2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 5l7 7-7 7M4 5l7 7-7 7"></path>
    </svg>
  </div>

</div>
</x-dc>
</body>
</html>
