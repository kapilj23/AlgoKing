<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    *{ box-sizing: border-box; }
    body { margin: 0; background: #0A0C12; color: #E8EAF2;
           font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8B72FF; } a:hover { color: #7A5FF0; }
    .cap { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500;
           letter-spacing: 0.13em; text-transform: uppercase; color: #7C8398; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0A0C12; display: flex; flex-direction: column;">

  <div style="height: 44px; flex: none;"></div>

  <!-- status strip: no greeting, no hamburger. Two facts only. -->
  <div style="height: 56px; flex: none; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 7px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="#F5A524">
        <path d="M13.5 2c.3 3-1.2 4.4-2.6 5.8C9.2 9.5 7.8 11 7.8 14a6.2 6.2 0 0 0 12.4 0c0-3.8-2.4-5.6-3.9-8.4-.6 1.4-1.5 2-2.3 2.3.5-2.1.3-4.3-.5-5.9z"></path>
        <path d="M9.6 15.4c0-1.8 1-2.6 1.8-3.4.5 1.6 1.7 2 2.6 2.6.8.6 1.3 1.4 1.3 2.4a2.9 2.9 0 0 1-5.7.4z" fill="#0A0C12"></path>
      </svg>
      <span class="mono" style="font-size: 15px; font-weight: 700; color: #E8EAF2;">7</span>
    </div>

    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="22" height="22" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="15" fill="none" stroke="#242938" stroke-width="3.5"></circle>
        <circle cx="18" cy="18" r="15" fill="none" stroke="#8B72FF" stroke-width="3.5" stroke-linecap="round"
                stroke-dasharray="50 94" transform="rotate(-90 18 18)"></circle>
      </svg>
      <span class="mono" style="font-size: 15px; font-weight: 500; color: #A8AEC2;">8 / 15</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 14px; min-height: 0;">

    <!-- THE primary card. Exactly one, always, above the fold. -->
    <div style="border-radius: 16px; background: #12141C; border: 1px solid #242938; padding: 20px;
                display: flex; flex-direction: column; gap: 14px;">
      <span class="cap">Continue where you left off</span>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #E8EAF2;">Two Pointers</span>
        <span style="font-size: 15px; color: #A8AEC2;">Try &middot; step 7 of 11</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #242938; overflow: hidden;">
          <div style="width: 72%; height: 100%; background: #8B72FF;"></div>
        </div>
        <span class="mono" style="font-size: 13px; color: #7C8398;">72%</span>
      </div>
      <div style="height: 56px; border-radius: 14px; background: #8B72FF; display: flex; align-items: center;
                  justify-content: center; gap: 10px;">
        <span style="font-size: 15px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #0A0C12;">Continue</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0A0C12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M13 6l6 6-6 6"></path>
        </svg>
      </div>
    </div>

    <!-- daily: secondary row when it is not the primary card -->
    <div style="border-radius: 16px; background: #12141C; border: 1px solid #242938; padding: 16px 18px;
                display: flex; align-items: center; gap: 14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#8B72FF"><path d="M13.5 2L4 13.2h6.1L9.8 22 20 10.6h-6.4z"></path></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 17px; font-weight: 600; color: #E8EAF2;">Today's Challenge</span>
        <span style="font-size: 14px; color: #7C8398;">3 rounds &middot; ~3 min &middot; best 4.2s</span>
      </div>
      <div style="display: flex; gap: 5px;">
        <div style="width: 8px; height: 8px; border-radius: 999px; background: #34D399;"></div>
        <div style="width: 8px; height: 8px; border-radius: 999px; background: #34D399;"></div>
        <div style="width: 8px; height: 8px; border-radius: 999px; background: #333A4D;"></div>
      </div>
    </div>

    <!-- journey preview: current section only -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span class="cap">Searching</span>
        <span class="mono" style="font-size: 13px; color: #7C8398;">2 / 3</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <div style="flex-grow: 1; border-radius: 12px; background: #12141C; border: 1px solid #242938; padding: 12px 10px;
                    display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle><path d="M8.5 12.2l2.4 2.4 4.6-4.9"></path>
          </svg>
          <span style="font-size: 13px; font-weight: 500; text-align: center; color: #A8AEC2; line-height: 16px;">Binary<br>Search</span>
        </div>
        <div style="flex-grow: 1; border-radius: 12px; background: #12141C; border: 1px solid #242938; padding: 12px 10px;
                    display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle><path d="M8.5 12.2l2.4 2.4 4.6-4.9"></path>
          </svg>
          <span style="font-size: 13px; font-weight: 500; text-align: center; color: #A8AEC2; line-height: 16px;">The<br>Race</span>
        </div>
        <div style="flex-grow: 1; border-radius: 12px; background: #191C26; border: 1px solid rgba(139,114,255,0.34); padding: 12px 10px;
                    display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <svg width="17" height="17" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="14" fill="none" stroke="#333A4D" stroke-width="4"></circle>
            <circle cx="18" cy="18" r="14" fill="none" stroke="#8B72FF" stroke-width="4" stroke-linecap="round"
                    stroke-dasharray="59 88" transform="rotate(-90 18 18)"></circle>
          </svg>
          <span style="font-size: 13px; font-weight: 500; text-align: center; color: #E8EAF2; line-height: 16px;">Two<br>Pointers</span>
        </div>
      </div>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; flex-direction: column; gap: 7px; padding-bottom: 12px;">
      <span class="cap">This week</span>
      <span style="font-size: 14px; color: #A8AEC2;">4 challenges &middot; 92% accuracy &middot; best streak 12</span>
    </div>
  </div>

  <!-- banner slot: height reserved at layout time so a late ad can never shift the card above -->
  <div style="height: 50px; flex: none; border-top: 1px solid #242938; background: #0D0F16;
              display: flex; align-items: center; justify-content: center;">
    <span class="cap" style="color: #4A5163;">Ad &middot; 320&times;50 reserved</span>
  </div>

</div>
</x-dc>
</body>
</html>
