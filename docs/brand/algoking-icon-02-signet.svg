      <circle cx="316" cy="214" r="15" fill="url(#m-gold)"/>
      <circle cx="708" cy="214" r="15" fill="url(#m-gold)"/>
      <circle cx="512" cy="152" r="23" fill="url(#m-gold)"/>
      <circle cx="512" cy="152" r="17" fill="url(#m-blue)"/>
