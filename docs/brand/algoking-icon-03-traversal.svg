      <circle cx="404" cy="772" r="17" fill="#0A1128" stroke="#5FA8FF" stroke-opacity="0.42" stroke-width="4"/>
      <circle cx="620" cy="772" r="17" fill="url(#t-gold)"/>
      <circle cx="348" cy="858" r="14" fill="#0A1128" stroke="#5FA8FF" stroke-opacity="0.42" stroke-width="4"/>
      <circle cx="460" cy="858" r="14" fill="#0A1128" stroke="#5FA8FF" stroke-opacity="0.42" stroke-width="4"/>
      <circle cx="564" cy="858" r="15" fill="url(#t-gold)"/>
      <circle cx="676" cy="858" r="14" fill="#0A1128" stroke="#5FA8FF" stroke-opacity="0.42" stroke-width="4"/>
