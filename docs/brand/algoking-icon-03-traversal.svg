<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>AlgoKing app icon - Traversal (algorithm-forward)</title>
  <defs>
    <clipPath id="t-tile"><rect width="1024" height="1024" rx="228" ry="228"/></clipPath>
    <linearGradient id="t-ground" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#141F42"/><stop offset="0.5" stop-color="#0A1128"/><stop offset="1" stop-color="#04070D"/>
    </linearGradient>
    <radialGradient id="t-lift" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#22376F" stop-opacity="0.70"/><stop offset="0.5" stop-color="#101B3C" stop-opacity="0.30"/><stop offset="1" stop-color="#04070D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="t-bounce" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0BB44" stop-opacity="0.26"/><stop offset="1" stop-color="#F0BB44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="t-scrim" cx="0.5" cy="0.5" r="0.5">
