      <path d="M512,686 L620,772" stroke="url(#t-gold)" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round"/>
      <path d="M404,772 L348,858" stroke="#4D9BFF" stroke-opacity="0.34" stroke-width="4" stroke-linecap="round"/>
      <path d="M404,772 L460,858" stroke="#4D9BFF" stroke-opacity="0.34" stroke-width="4" stroke-linecap="round"/>
      <path d="M620,772 L564,858" stroke="url(#t-gold)" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round"/>
      <path d="M620,772 L676,858" stroke="#4D9BFF" stroke-opacity="0.34" stroke-width="4" stroke-linecap="round"/>
