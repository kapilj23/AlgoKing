      <g clip-path="url(#s-clipA)"><rect x="245" y="345" width="310" height="325" fill="url(#s-sheenLetter)"/></g>
      <path fill-rule="evenodd" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2" d="M384,355 L416,355 L545,660 L255,660 Z M400,457 L434,528 L366,528 Z M341,580 L459,580 L497,660 L303,660 Z"/>
      <path fill="url(#s-gold)" d="M585,355 L657,355 L657,660 L585,660 Z M740,355 L835,355 L752,500 L657,500 Z M657,500 L752,500 L857,660 L762,660 Z"/>
      <g clip-path="url(#s-clipK)"><rect x="575" y="345" width="292" height="325" fill="url(#s-sheenLetter)"/></g>
      <path fill="none" stroke="#FFF4CE" stroke-opacity="0.34" stroke-width="2" d="M585,355 L657,355 L657,660 L585,660 Z M740,355 L835,355 L752,500 L657,500 Z M657,500 L752,500 L857,660 L762,660 Z"/>
    </g>
