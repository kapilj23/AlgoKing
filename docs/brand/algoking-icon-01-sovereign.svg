      <path d="M425,818 L425,790 Q425,778 437,778 L489,778 Q501,778 501,790 L501,818 Z" fill="url(#s-blue)" opacity="0.82"/>
      <path d="M523,818 L523,772 Q523,760 535,760 L587,760 Q599,760 599,772 L599,818 Z" fill="url(#s-blue)" opacity="0.90"/>
      <path d="M621,818 L621,752 Q621,740 633,740 L685,740 Q697,740 697,752 L697,818 Z" fill="url(#s-gold)"/>
